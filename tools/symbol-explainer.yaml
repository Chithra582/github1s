name: "symbol-explainer"
description: "Extracts source context around a selected symbol or file slice for AI explanation."
input_schema:
  type: "object"
  properties:
    file_path:
      type: "string"
      description: "Path to the target source file."
    line_start:
      type: "integer"
      description: "Starting line number of selection."
    line_end:
      type: "integer"
      description: "Ending line number of selection."
  required:
    - "file_path"
    - "line_start"
    - "line_end"
