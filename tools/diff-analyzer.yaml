name: "diff-analyzer"
description: "Calculates and visualizes changesets between commits, branches, or pull requests."
input_schema:
  type: "object"
  properties:
    base_ref:
      type: "string"
      description: "Base commit, branch, or tag."
    head_ref:
      type: "string"
      description: "Target commit, branch, or tag."
  required:
    - "base_ref"
    - "head_ref"
